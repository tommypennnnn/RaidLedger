<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guild Raid Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f3f5fb; --surface:#ffffff; --surface2:#f2f5fb; --raise:#fbfcfe;
    --border:#e4e8f2; --border2:#d7dcea;
    --ink:#161a23; --ink2:#3d4351; --muted:#727a8c;
    --accent:#6b57e6; --accent-hover:#5a45d8; --accent-soft:#eeecfd;
    --good:#10a150; --good-soft:#e6f6ee; --good-ink:#0a7d3d;
    --warn:#c2760a; --warn-soft:#fbf0dc; --warn-ink:#9a5d05;
    --bad:#e14b4f; --bad-soft:#fdecec; --bad-ink:#c0343a;
    --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 16px rgba(20,30,60,.06);
    --shadow-lg:0 8px 30px rgba(20,30,60,.10);
    --radius:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Space Grotesk",sans-serif;letter-spacing:-.01em;margin:0}
  .num{font-family:"Space Grotesk",sans-serif;font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;border-radius:var(--radius-sm)}
  input,select{font:inherit;color:var(--ink);background:var(--surface);
    border:1px solid var(--border2);border-radius:var(--radius-sm);padding:.55rem .7rem}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .btn{background:var(--accent);color:#fff;padding:.6rem 1.05rem;font-weight:600}
  .btn:hover{background:var(--accent-hover)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--border2)}
  .btn.ghost:hover{background:var(--surface2)}
  .btn.danger{background:var(--bad-soft);color:var(--bad-ink)}
  .btn.danger:hover{background:#fbdcdd}
  .btn.sm{padding:.4rem .7rem;font-size:.85rem}

  /* ---------- auth ---------- */
  #auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
  .authcard{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:2rem;text-align:center}
  .crest{width:46px;height:46px;border-radius:12px;margin:0 auto .9rem;
    background:linear-gradient(135deg,var(--accent),#9a7bff);display:grid;place-items:center;
    color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:1.2rem}
  .authcard input{width:100%;margin:.35rem 0}
  .err{color:var(--bad-ink);font-size:.88rem;min-height:1.2em;margin-top:.4rem}

  /* ---------- shell ---------- */
  header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:"Space Grotesk";font-weight:700}
  .brand .crest{width:30px;height:30px;margin:0;border-radius:8px;font-size:.9rem}
  nav.tabs{display:flex;gap:.15rem;margin-left:.5rem;flex-wrap:wrap}
  nav.tabs button{background:transparent;color:var(--muted);padding:.45rem .8rem;font-weight:600;
    font-size:.92rem;border-radius:8px}
  nav.tabs button:hover{background:var(--surface2);color:var(--ink2)}
  nav.tabs button.active{background:var(--accent-soft);color:var(--accent)}
  .spacer{flex:1}
  .who{color:var(--muted);font-size:.85rem}
  main{max-width:1080px;margin:0 auto;padding:1.5rem 1.25rem 4rem}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:1.15rem 1.25rem;margin-bottom:1.15rem}
  .card h2{font-size:1.02rem;margin-bottom:.15rem}
  .card .sub{color:var(--muted);font-size:.85rem;margin-bottom:.9rem}
  .row{display:flex;gap:1.15rem;flex-wrap:wrap}
  .row>.card{flex:1;min-width:260px;margin-bottom:0}
  .grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.15rem;margin-bottom:1.15rem}
  @media(max-width:720px){.grid-stats{grid-template-columns:repeat(2,1fr)}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:1rem 1.1rem}
  .stat .label{color:var(--muted);font-size:.8rem;font-weight:500}
  .stat .value{font-family:"Space Grotesk";font-weight:700;font-size:1.9rem;line-height:1.1;margin-top:.2rem}
  .stat .value.num{letter-spacing:-.02em}

  /* ---------- player identity ---------- */
  .pill-dot{width:9px;height:9px;border-radius:50%;display:inline-block;
    box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
  .pname{display:inline-flex;align-items:center;gap:.5rem;font-weight:600}
  .pname .cls{color:var(--muted);font-weight:500;font-size:.85em}

  /* ---------- priority list ---------- */
  .plist{display:flex;flex-direction:column;gap:.5rem}
  .prow{display:flex;align-items:center;gap:.9rem;padding:.7rem .85rem;border:1px solid var(--border);
    border-radius:12px;background:var(--raise)}
  .prow:hover{border-color:var(--border2)}
  .rank{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;
    font-family:"Space Grotesk";font-weight:700;font-size:.85rem;background:var(--surface2);color:var(--muted)}
  .prow:nth-child(1) .rank{background:#fff4d6;color:#a9791a}
  .prow:nth-child(2) .rank{background:#eef1f6;color:#71798c}
  .prow:nth-child(3) .rank{background:#f6e7db;color:#a26b3e}
  .pmeta{flex:1;min-width:0}
  .pwhy{color:var(--muted);font-size:.82rem;margin-top:.1rem}
  .pscore{font-family:"Space Grotesk";font-weight:700;font-size:1.15rem}

  .tag{font-size:.72rem;font-weight:600;padding:.2rem .5rem;border-radius:999px;white-space:nowrap}
  .tag.good{background:var(--good-soft);color:var(--good-ink)}
  .tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .tag.bad{background:var(--bad-soft);color:var(--bad-ink)}
  .tag.neutral{background:var(--surface2);color:var(--muted)}

  /* ---------- tables ---------- */
  .tablewrap{overflow-x:auto;margin:0 -.2rem}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;
    cursor:pointer;user-select:none;white-space:nowrap}
  th.no-sort{cursor:default}
  tbody tr:hover{background:var(--surface2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.clickable{cursor:pointer}

  /* mini bar meter */
  .meter{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;min-width:70px}
  .meter>span{display:block;height:100%;border-radius:4px}
  .metric-cell{display:flex;align-items:center;gap:.5rem}
  .metric-cell .num{min-width:34px;text-align:right;font-size:.85rem}

  /* ---------- drop zones ---------- */
  .drops{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:640px){.drops{grid-template-columns:1fr}}
  .drop{border:1.5px dashed var(--border2);border-radius:12px;padding:1.4rem;text-align:center;
    cursor:pointer;background:var(--surface2);transition:.15s}
  .drop:hover,.drop.drag{border-color:var(--accent);background:var(--accent-soft)}
  .drop .big{font-family:"Space Grotesk";font-weight:600}
  .drop .hint{color:var(--muted);font-size:.83rem;margin-top:.25rem}
  .drop input{display:none}
  .status{font-size:.83rem;margin-top:.5rem;min-height:1.2em}
  .status.ok{color:var(--good-ink)} .status.err{color:var(--bad-ink)} .status.info{color:var(--muted)}
  .raidform{display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:.6rem;align-items:end;margin-top:1rem}
  @media(max-width:640px){.raidform{grid-template-columns:1fr}}
  label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:.25rem}

  .banner{border-radius:10px;padding:.7rem .9rem;font-size:.88rem;margin-bottom:1rem}
  .banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
  .empty{color:var(--muted);text-align:center;padding:2rem 1rem;font-size:.9rem}
  .back{color:var(--muted);font-size:.88rem;cursor:pointer;display:inline-flex;gap:.3rem;margin-bottom:.6rem}
  .back:hover{color:var(--ink2)}
  .bars{display:flex;flex-direction:column;gap:.55rem}
  .barrow{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:.6rem;font-size:.86rem}
  .barrow .lbl{color:var(--ink2)}
  .spin{color:var(--muted);padding:2rem;text-align:center}
</style>
</head>
<body>

<section id="auth">
  <div class="authcard">
    <div class="crest">RL</div>
    <h1 style="font-size:1.3rem">Guild Raid Ledger</h1>
    <p style="color:var(--muted);font-size:.9rem;margin:.3rem 0 1rem">Officers &amp; loot council. Sign in to continue.</p>
    <input id="email" type="email" placeholder="officer email" autocomplete="username" />
    <input id="password" type="password" placeholder="password" autocomplete="current-password" />
    <button id="sign-in" class="btn" style="width:100%;margin-top:.5rem">Sign in</button>
    <p id="auth-error" class="err"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><div class="crest">RL</div><span>Raid Ledger</span></div>
    <nav class="tabs" id="tabs">
      <button data-view="home" class="active">Home</button>
      <button data-view="players">Players</button>
      <button data-view="raids">Raids</button>
      <button data-view="loot">Loot</button>
      <button data-view="upload">Upload</button>
    </nav>
    <div class="spacer"></div>
    <span class="who" id="who"></span>
    <button id="sign-out" class="btn ghost sm">Sign out</button>
  </header>
  <main id="view-root"></main>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
